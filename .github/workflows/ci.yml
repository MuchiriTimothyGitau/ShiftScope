name: CI

on:
  push:
    branches: [main, dev/setup-phase]
  pull_request:
    branches: [main, dev/setup-phase]

jobs:
  node-tests:
    name: Node tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [scheduler, analysis_chain]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npx vitest run

  python-tests:
    name: Python tests (scraping_pipeline)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: scraping_pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest
