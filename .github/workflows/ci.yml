name: CI

on:
  push:
    branches: [main, dev/setup-phase]
  pull_request:
    branches: [main, dev/setup-phase]

jobs:
  root-lint:
    name: Lint (Express server + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx tsc --noEmit

  root-build:
    name: Build (Express server + Vite frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build
      - run: npx esbuild server.ts --bundle --platform=node --format=esm --packages=external --outfile=server.js

  scheduler-tests:
    name: Tests (scheduler)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx vitest run

  analysis-tests:
    name: Tests (analysis_chain)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analysis_chain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx vitest run

  delivery-tests:
    name: Tests (delivery)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: delivery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx vitest run

  scraping-tests:
    name: Tests (scraping_pipeline)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraping_pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium
      - run: pytest -v
