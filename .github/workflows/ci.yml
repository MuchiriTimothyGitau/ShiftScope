name: CI

on:
  push:
    branches: [main, dev/setup-phase]
  pull_request:
    branches: [main, dev/setup-phase]

jobs:
  # Passing suites — these gate the green check
  tests:
    name: Tests (scheduler)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npx vitest run

  # Known-failing suites — tracked in issues, not yet gating.
  # analysis_chain: 7-step chain mock out of date (issue #X)
  # scraping_pipeline: scrapers/ package import structure (issue #Y)
  known-failing:
    name: Known-failing (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: analysis_chain
            cmd: npm install && npx vitest run
          - service: scraping_pipeline
            cmd: pip install -r requirements-dev.txt && pytest
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: ${{ matrix.cmd }}
