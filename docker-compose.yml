version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  express-server:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports: ["3000:3000"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    env_file: .env
    ports: ["9090:9090"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  scraping-pipeline:
    build:
      context: .
      dockerfile: scraping_pipeline/Dockerfile
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
    restart: unless-stopped

  analysis-chain:
    build:
      context: .
      dockerfile: analysis_chain/Dockerfile
    env_file: .env
    ports: ["9091:9091"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  delivery-engine:
    build:
      context: .
      dockerfile: delivery/Dockerfile
    env_file: .env
    ports: ["9092:9092"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_data:

networks:
  default:
    name: shiftscope
