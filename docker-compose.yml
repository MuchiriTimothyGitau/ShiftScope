version: '3.9'
services:
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    volumes: ['redis_data:/data']

  scheduler:
    build: ./scheduler
    env_file: .env
    depends_on: [redis]
    restart: unless-stopped

  scraping-pipeline:
    build: ./scraping_pipeline
    env_file: .env
    depends_on: [redis]
    restart: unless-stopped
    # Playwright requires additional deps
    environment:
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright

  analysis-chain:
    build: ./analysis_chain
    env_file: .env
    depends_on: [redis]
    restart: unless-stopped

  delivery-engine:
    build: ./delivery
    env_file: .env
    depends_on: [redis]
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    env_file: .env
    ports: ['3000:3000']
    restart: unless-stopped

volumes:
  redis_data: